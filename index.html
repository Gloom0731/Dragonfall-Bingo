<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RuneScape Bingo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
:root{
  --bg:#d9cba5; --panel:#bfae85; --edge:#4a3f2c; --edge-hi:#e9dcb8; --ink:#2b2418; --gold:#ffd23a; --title:#7a4a0c;
  --t-easy:#4c8a2b; --t-med:#c27a1a; --t-hard:#a8267c; --t-elite:#8a1616;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17130d; --panel:#3a3427; --edge:#0d0a06; --edge-hi:#6b5f46; --ink:#eadfc0; --gold:#ffe14d; --title:#ffd23a;}
}
:root[data-theme="dark"]{--bg:#17130d; --panel:#3a3427; --edge:#0d0a06; --edge-hi:#6b5f46; --ink:#eadfc0; --gold:#ffe14d; --title:#ffd23a;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans","Trebuchet MS",sans-serif;min-height:100vh;padding:20px 12px 32px}
.wrap{max-width:900px;margin:0 auto}
h1{font-family:"MedievalSharp",Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,52px);text-align:center;margin:4px 0 2px;color:var(--title);text-shadow:2px 2px 0 var(--edge);letter-spacing:.02em}
.sub{text-align:center;margin:0 0 16px;font-size:16px;opacity:.85}
.frame{background:var(--panel);border:4px solid var(--edge);box-shadow:inset 0 0 0 3px var(--edge-hi),inset 0 0 0 5px var(--edge);padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:12px}
.stats{display:flex;gap:18px;font-size:18px;font-weight:600}
.stats b{color:var(--gold);text-shadow:1px 1px 0 #000}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border:2px solid var(--edge);display:inline-block}
.board{display:grid;grid-template-columns:36px repeat(7,1fr);gap:4px}
.bonus{display:flex;align-items:center;justify-content:center;min-height:30px;font-size:clamp(11px,2.2vw,15px);font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--edge-hi)}
.bonus.earned{background:var(--gold);color:#2b2418;box-shadow:inset 0 0 0 2px #fff6b0}
.bonus,.pts b,.stats b{font-family:Arial,"Helvetica Neue",sans-serif;font-variant-numeric:lining-nums}
.pts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pts div{flex:1 1 90px;display:flex;flex-direction:column;background:var(--bg);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 var(--edge-hi);padding:6px 10px}
.pts span{font-size:13px;opacity:.8}
.pts b{font-size:26px;font-weight:600;color:var(--title);text-shadow:1px 1px 0 var(--edge)}
.pts small{font-size:12px;opacity:.75}
.cell{appearance:none;font:inherit;color:#fff;cursor:pointer;position:relative;aspect-ratio:1/1;padding:4px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(9.5px,2.2vw,15px);line-height:1.15;overflow-wrap:break-word;text-shadow:1px 1px 0 #000,-1px 0 0 rgba(0,0,0,.6);
  border:2px solid var(--edge);box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.4);transition:filter .15s,transform .1s}
.cell:hover{filter:brightness(1.12)}
.ico{position:absolute;inset:12%;width:76%;height:76%;object-fit:contain;opacity:.38;image-rendering:pixelated;pointer-events:none}
.t{position:relative;z-index:1}
.ic{position:relative;z-index:1;flex:none;width:clamp(13px,3vw,24px);height:clamp(13px,3vw,24px);color:#fff;opacity:.92;filter:drop-shadow(1px 1px 0 #000)}
.cell:active{transform:scale(.97)}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px;z-index:2}
.easy{background:var(--t-easy)} .med{background:var(--t-med)} .hard{background:var(--t-hard)} .elite{background:var(--t-elite)}
.cell.done{filter:brightness(.45) saturate(.7)}
.cell.done::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,6vw,52px);color:var(--gold);text-shadow:2px 2px 0 #000;filter:brightness(2.2)}
.cell.line{box-shadow:inset 0 0 0 3px var(--gold),inset 2px 2px 0 rgba(255,255,255,.3)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.reset{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--edge);padding:6px 14px;cursor:pointer;box-shadow:inset 2px 2px 0 var(--edge-hi)}
.reset:hover{background:var(--panel)}
.reset:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:600px){.cell{aspect-ratio:1/1.4;padding:2px}.board{gap:3px;grid-template-columns:28px repeat(7,1fr)}.frame{padding:8px}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>RuneScape Bingo</h1>
  <p class="sub">When a tile is completed, tap it to tick it off. Finish a row or column to earn its bonus points.</p>
  <div class="frame">
    <div class="bar">
      <div class="stats"><span>Tiles <b id="n">0</b>/49</span><span>Lines <b id="l">0</b>/14</span></div>
      <div class="legend">
        <span><i style="background:var(--t-easy)"></i>Easy, 1 pt</span>
        <span><i style="background:var(--t-med)"></i>Medium, 2 pts</span>
        <span><i style="background:var(--t-hard)"></i>Hard, 3 pts</span>
        <span><i style="background:var(--t-elite)"></i>Elite, 4 pts</span>
      </div>
    </div>
    <div class="pts"><div><span>Tile points</span><b id="sp">0</b></div><div><span>Bonus points</span><b id="bp">0</b></div><div><span>Total</span><b id="tp">0</b><small id="mx"></small></div></div>
    <div class="board" id="board"></div>
    <div class="foot"><span>Progress saves in this browser.</span><button class="reset" id="reset">Clear board</button></div>
  </div>
</div>
<script>
var G=[
["Black Mask|e","Dragon Imp|e","Hunter XP|m","Dragon Limbs|m","Lord of the Rings|m","Tecu|e","Glacial Tom|e"],
["Ele Amulet|e","Tomes|e","Revs|h","Enhanced|h","Dragon chain|h","Wildy Ring|e","Cudgel|e"],
["Barrows|m","Twinflame|m","Yama|h","Maggot King Kirsten & Tooth|x","Goat Pet|x","Zenytes x2|m","Zombie axe/Helmet|m"],
["Jar|m","Noxius Halberd pieces|m","Corp unique|x","Mega Rare|x","Nex|x","Bludgeon Pieces|m","GWD|m"],
["Pharaoh’s Sceptre|m","Moons|m","Imbued Heart / Eternal Gem|x","Nightmare unique|x","Doom|h","Zulrah|m","Hopper|m"],
["Brine Sabre|e","GOTR unique|e","Brimstone ring|h","Visage|h","Cerb|h","Dragon Pick|e","Leaf Blade|e"],
["Hallowfell|e","SR Quest|e","Lock Pick|m","5x Awakened Orbs|m","Sailing XP|m","Huey Unique|e","Crafting Chisel|e"]
];
var CLS={e:"easy",m:"med",h:"hard",x:"elite"};
var WIKI="https://oldschool.runescape.wiki/images/";
var IMG=[
"Black_mask.png","Dragon_impling_jar.png","Hunter_icon.png","Dragon_limbs.png",null,"Tecu_salamander.png","Glacial_temotli.png",
null,"Tome_of_fire.png",null,"Enhanced_crystal_weapon_seed.png","Dragon_chainbody.png",null,null,
"Dharok's_helm.png","Twinflame_staff.png",null,null,null,"Zenyte_shard.png","Zombie_axe.png",
null,"Noxious_halberd.png","Elysian_sigil.png",null,"Zaryte_vambraces.png","Abyssal_bludgeon.png","Bandos_chestplate.png",
"Pharaoh's_sceptre.png","Blood_moon_chestplate.png","Imbued_heart.png","Inquisitor's_mace.png","Avernic_treads.png","Serpentine_helm.png",null,
"Brine_sabre.png","Abyssal_lantern.png","Brimstone_ring.png","Draconic_visage.png","Primordial_crystal.png","Dragon_pickaxe.png","Leaf-bladed_sword.png",
null,"Quest_point_icon.png","Lockpick.png","Awakener's_orb.png","Sailing_icon.png","Tome_of_earth.png","Chisel.png"];
var ICONS={
mask:'<path d="M4 6c5 2 11 2 16 0v6c0 5-4 8-8 9-4-1-8-4-8-9z"/><path d="M8 11l2 1M16 11l-2 1"/>',
jar:'<path d="M8 4h8M9 4v3c-3 1-4 3-4 6v6a2 2 0 002 2h10a2 2 0 002-2v-6c0-3-1-5-4-6V4"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
bow:'<path d="M6 3c10 3 12 15 0 18M6 3v18M6 12h14M17 9l3 3-3 3"/>',
ring:'<circle cx="12" cy="15" r="6"/><path d="M9 7l3-4 3 4-3 3z"/>',
paw:'<circle cx="7" cy="9" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="17" cy="9" r="2"/><path d="M12 12c-4 0-6 3-6 5 0 2 2 2 6 2s6 0 6-2c0-2-2-5-6-5z"/>',
crystal:'<path d="M12 2l5 7-5 13-5-13z"/><path d="M7 9h10"/>',
amulet:'<path d="M5 3c0 8 14 8 14 0"/><path d="M12 12l4 4-4 5-4-5z"/>',
book:'<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/>',
sword:'<path d="M20 4l-9 9M9 11l4 4M8 16l-4 4M20 4h-4M20 4v4"/>',
gem:'<path d="M6 4h12l4 6-10 11L2 10z"/><path d="M2 10h20"/>',
body:'<path d="M8 3L3 7l3 4 2-1v11h8V10l2 1 3-4-5-4c-1 2-2 3-4 3S9 5 8 3z"/>',
mace:'<path d="M5 21l9-9"/><path d="M12 4l8 8-4 4-8-8z"/>',
helm:'<path d="M4 15v-4a8 8 0 0116 0v4h-5v4H9v-4z"/>',
flame:'<path d="M12 3c1 4 5 6 5 11a5 5 0 01-10 0c0-3 2-4 2-7 2 1 3 2 3-4z"/>',
horns:'<path d="M5 4c0 5 2 7 5 8M19 4c0 5-2 7-5 8M9 12c0 5 2 8 3 9 1-1 3-4 3-9z"/>',
fang:'<path d="M6 4c0 10 6 16 12 17-1-6-3-10-12-17z"/>',
axe:'<path d="M6 20L16 6M10 4c4-1 8 1 9 5-4 1-7-1-9-5z"/>',
shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',
crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
staff:'<path d="M5 21L15 11"/><circle cx="17" cy="7" r="4"/>',
moon:'<path d="M20 14A8 8 0 119 4a6 6 0 0011 10z"/>',
heart:'<path d="M12 21C4 15 3 10 3 8a5 5 0 019-3 5 5 0 019 3c0 2-1 7-9 13z"/>',
skull:'<path d="M5 11a7 7 0 0114 0c0 3-1 4-2 5v3H7v-3c-1-1-2-2-2-5z"/><circle cx="9.5" cy="11" r="1.5"/><circle cx="14.5" cy="11" r="1.5"/>',
eye:'<path d="M2 12c3-6 7-8 10-8s7 2 10 8c-3 6-7 8-10 8S5 18 2 12z"/><circle cx="12" cy="12" r="3"/>',
boots:'<path d="M8 3h6v9l6 3v5H6v-5l2-1z"/>',
pick:'<path d="M4 11C8 4 16 4 20 11M12 7L6 21"/>',
scroll:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
key:'<circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M16 16l2-2M19 19l2-2"/>',
orb:'<circle cx="12" cy="12" r="8"/><path d="M8 9a5 5 0 014-3"/>',
anchor:'<circle cx="12" cy="5" r="2"/><path d="M12 7v14M6 12H4c0 5 4 9 8 9s8-4 8-9h-2M8 12h8"/>',
chisel:'<path d="M4 20l8-8M12 12l6-6 3 3-6 6zM7 17l-3 3"/>'};
var ICN=[
"mask","jar","star","bow","ring","paw","crystal",
"amulet","book","sword","gem","body","ring","mace",
"helm","flame","horns","fang","paw","gem","axe",
"jar","axe","shield","crown","crystal","mace","sword",
"staff","moon","heart","skull","eye","fang","boots",
"sword","orb","ring","shield","paw","pick","sword",
"boots","scroll","key","orb","anchor","book","chisel"];
var KEY="rs-bingo-v1", done={}, cells=[], boardEl=document.getElementById("board");
var RB=[11,13,19,20,19,13,11], CB=[11,11,23,25,23,11,11], PTS={e:1,m:2,h:3,x:4};
var lines=[], i, r, sq=[], maxSq=0, maxBonus=0, badges={};
G.forEach(function(row){row.forEach(function(it){var v=PTS[it.split("|")[1]];sq.push(v);maxSq+=v;});});
for(r=0;r<7;r++){var a=[],b=[];for(i=0;i<7;i++){a.push(r*7+i);b.push(i*7+r);}lines.push({k:a,pts:RB[r],el:"r"+r},{k:b,pts:CB[r],el:"c"+r});maxBonus+=RB[r]+CB[r];}
function badge(id,pts){var d=document.createElement("div");d.className="bonus";d.textContent="+"+pts;d.title="Bonus for finishing this "+(id[0]==="r"?"row":"column");badges[id]=d;return d;}
try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");if(s&&typeof s==="object")done=s;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}
function render(){
  var inLine={},n=0,l=0;
  var sp=0,bp=0;
  lines.forEach(function(ln){var ok=ln.k.every(function(k){return done[k];});badges[ln.el].classList.toggle("earned",ok);if(ok){l++;bp+=ln.pts;ln.k.forEach(function(k){inLine[k]=1;});}});
  cells.forEach(function(c,k){
    var on=!!done[k]; if(on){n++;sp+=sq[k];}
    c.classList.toggle("done",on); c.classList.toggle("line",!!inLine[k]); c.setAttribute("aria-pressed",on);
  });
  document.getElementById("n").textContent=n; document.getElementById("l").textContent=l;
  document.getElementById("sp").textContent=sp; document.getElementById("bp").textContent=bp; document.getElementById("tp").textContent=sp+bp;
}
G.forEach(function(row,ri){row.forEach(function(item,ci){
  var p=item.split("|"), k=ri*7+ci, b=document.createElement("button");
  if(ci===0){boardEl.appendChild(badge("r"+ri,RB[ri]));}
  b.type="button"; b.className="cell "+CLS[p[1]];
  if(IMG[k]){var im=document.createElement("img");im.className="ico";im.alt="";im.loading="lazy";im.referrerPolicy="no-referrer";im.onerror=function(){this.remove();};im.src=WIKI+IMG[k];b.appendChild(im);}
  var tx=document.createElement("span");tx.className="t";tx.textContent=p[0];b.appendChild(tx);
  b.insertAdjacentHTML("beforeend",'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[ICN[k]]+'</svg>');
  b.addEventListener("click",function(){if(done[k])delete done[k];else done[k]=1;save();render();});
  boardEl.appendChild(b); cells.push(b);
});});
boardEl.appendChild(document.createElement("div"));
for(i=0;i<7;i++){boardEl.appendChild(badge("c"+i,CB[i]));}
document.getElementById("mx").textContent="of "+(maxSq+maxBonus)+" possible";
var rb=document.getElementById("reset"), t;
rb.addEventListener("click",function(){
  if(rb.dataset.arm){done={};save();render();rb.textContent="Clear board";delete rb.dataset.arm;clearTimeout(t);return;}
  rb.dataset.arm="1";rb.textContent="Tap again to clear";
  t=setTimeout(function(){rb.textContent="Clear board";delete rb.dataset.arm;},3000);
});
render();
</script>
</body>
</html>
